    </g>
    <!-- moving data packets -->
    <circle r="4.5" fill="#ffffff" filter="url(#glow)"><animateMotion dur="4.5s" repeatCount="indefinite" path="M128 211L213 256L294 196L389 240L435 185"/></circle>
    <circle r="4" fill="#a5b4fc" filter="url(#glow)"><animateMotion dur="5.2s" repeatCount="indefinite" path="M112 362L208 326L294 385L390 330L448 382"/></circle>
    <circle r="3.5" fill="#6ee7b7" filter="url(#glow)"><animateMotion dur="3.8s" repeatCount="indefinite" path="M133 421L208 326L292 345L415 413"/></circle>
