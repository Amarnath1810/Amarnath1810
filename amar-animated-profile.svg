      <g class="pulse"><rect x="363" y="312" width="114" height="42" rx="10" fill="#172448" stroke="#818cf8" stroke-width="1.5"/><text x="420" y="329" fill="#a5b4fc" font-size="10">BACKEND</text><text x="420" y="345" fill="#ffffff">Node.js</text></g>
