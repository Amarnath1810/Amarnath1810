<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Veeramreddy Amarnath Reddy — Animated Developer Profile</title>
  <desc id="desc">Animated terminal-style profile card with developer information, skills, projects, and clickable links.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fcff"/><stop offset="100%" stop-color="#eaf5ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#f7fbff"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00b7df"/><stop offset="50%" stop-color="#398cff"/><stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#2d8db4" flood-opacity=".16"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#79c9eb" stroke-width=".7" opacity=".35"/>
    </pattern>
    <clipPath id="avatarClip"><rect x="42" y="115" width="475" height="410" rx="18"/></clipPath>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .ui{font-family:Inter,Segoe UI,Arial,sans-serif}
      .label{fill:#008ec4;font-weight:700}
      .value{fill:#1d2a42}
      .small{font-size:14px}
      .line{stroke:#b6d9eb;stroke-width:1}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      .blink{animation:blink 1.1s steps(2,start) infinite}
      .float{animation:float 4s ease-in-out infinite}
      .dash{stroke-dasharray:7 12;animation:dash 18s linear infinite}
      .scan{animation:scan 5s linear infinite}
      .typing{stroke-dasharray:420;stroke-dashoffset:420;animation:type 4.5s steps(42,end) .7s forwards}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.2}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      @keyframes dash{to{stroke-dashoffset:-380}}
      @keyframes scan{0%{transform:translateY(-20px);opacity:0}15%{opacity:.65}85%{opacity:.65}100%{transform:translateY(410px);opacity:0}}
      @keyframes type{to{stroke-dashoffset:0}}
    </style>
  </defs>

  <rect width="1200" height="680" rx="26" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="677" rx="25" fill="none" stroke="#69bddb" stroke-width="2" filter="url(#shadow)"/>
  <rect x="14" y="14" width="1172" height="652" rx="20" fill="url(#grid)" opacity=".65"/>
