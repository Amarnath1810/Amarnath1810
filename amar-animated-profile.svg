      <g class="pulse"><rect x="361" y="157" width="118" height="42" rx="10" fill="#172448" stroke="#818cf8" stroke-width="1.5"/><text x="420" y="174" fill="#a5b4fc" font-size="10">WEB APP</text><text x="420" y="190" fill="#ffffff">Next.js</text></g>
